name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This "environment" block is required. Your GROQ_API_KEY / GEMINI_API_KEY
    # secrets need to be visible to this job — add them as either repository
    # secrets (Settings → Secrets and variables → Actions) or as secrets on
    # the "github-pages" environment (Settings → Environments → github-pages).
    # Without this block, environment-scoped secrets silently resolve to ''.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Both keys are injected in ONE step, BEFORE the artifact is uploaded.
      # This must run before upload-pages-artifact, or the injected keys
      # never make it into the deployed site.
      - name: Inject API Keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p js
          echo "window.GROQ_API_KEY = '${GROQ_API_KEY}';" > js/env-config.js
          echo "window.GEMINI_API_KEY = '${GEMINI_API_KEY}';" >> js/env-config.js

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
